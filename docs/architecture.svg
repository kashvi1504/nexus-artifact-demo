<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 800" width="820" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#1b5e8a; stroke-width:1.6; }
      .stage { fill:#eef5fb; stroke:#1b5e8a; stroke-width:1.2; }
      .key { fill:#fff1e6; stroke:#c2410c; stroke-width:1.6; }
      .t { font-size:14px; fill:#111827; }
      .tb { font-size:15px; font-weight:bold; fill:#111827; }
      .s { font-size:11.5px; fill:#4b5563; }
      .lbl { font-size:11.5px; fill:#c2410c; font-weight:bold; }
      .ln { stroke:#374151; stroke-width:1.5; fill:none; }
      .lnO { stroke:#c2410c; stroke-width:2; fill:none; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="800" fill="#f8fafc"/>
  <text x="410" y="26" text-anchor="middle" class="tb" font-size="17">Automated Artifact Management Using Nexus Repository - Architecture</text>

  <!-- Developer -->
  <rect x="60" y="45" width="320" height="48" rx="8" class="box"/>
  <text x="220" y="66" text-anchor="middle" class="tb">Developer (MacBook)</text>
  <text x="220" y="84" text-anchor="middle" class="s">writes code + tests, git push</text>
  <line x1="220" y1="93" x2="220" y2="118" class="ln" marker-end="url(#arr)"/>

  <!-- GitHub -->
  <rect x="60" y="120" width="320" height="48" rx="8" class="box"/>
  <text x="220" y="141" text-anchor="middle" class="tb">GitHub repository</text>
  <text x="220" y="159" text-anchor="middle" class="s">source code, Jenkinsfile, Dockerfile, tests</text>
  <line x1="220" y1="168" x2="220" y2="198" class="ln" marker-end="url(#arr)"/>
  <text x="228" y="188" class="s">Jenkins polls for new commits</text>

  <!-- Jenkins frame -->
  <rect x="40" y="200" width="360" height="475" rx="10" fill="none" stroke="#1b5e8a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="56" y="222" class="tb">Jenkins pipeline (localhost:8080)</text>

  <g>
    <rect x="70" y="235" width="300" height="36" rx="6" class="stage"/><text x="86" y="258" class="t">1. Checkout</text><text x="360" y="258" text-anchor="end" class="s">git clone</text>
    <rect x="70" y="285" width="300" height="36" rx="6" class="stage"/><text x="86" y="308" class="t">2. Install Dependencies</text><text x="360" y="308" text-anchor="end" class="s">npm ci</text>
    <rect x="70" y="335" width="300" height="36" rx="6" class="stage"/><text x="86" y="358" class="t">3. Automated Tests</text><text x="360" y="358" text-anchor="end" class="s">Jest (fail = stop)</text>
    <rect x="70" y="385" width="300" height="36" rx="6" class="stage"/><text x="86" y="408" class="t">4. Build / Package</text><text x="360" y="408" text-anchor="end" class="s">npm pack → .tgz</text>
    <rect x="70" y="435" width="300" height="36" rx="6" class="key"/><text x="86" y="458" class="t">5. Publish to Nexus</text><text x="360" y="458" text-anchor="end" class="s">curl PUT</text>
    <rect x="70" y="485" width="300" height="36" rx="6" class="key"/><text x="86" y="508" class="t">6. Fetch from Nexus</text><text x="360" y="508" text-anchor="end" class="s">curl GET + sha1</text>
    <rect x="70" y="535" width="300" height="36" rx="6" class="stage"/><text x="86" y="558" class="t">7. Build Docker Image</text><text x="360" y="558" text-anchor="end" class="s">docker build</text>
    <rect x="70" y="585" width="300" height="36" rx="6" class="stage"/><text x="86" y="608" class="t">8. Deploy Application</text><text x="360" y="608" text-anchor="end" class="s">docker run</text>
    <rect x="70" y="630" width="300" height="32" rx="6" class="stage"/>
  </g>
  <g class="ln">
    <line x1="220" y1="271" x2="220" y2="283" marker-end="url(#arr)"/>
    <line x1="220" y1="321" x2="220" y2="333" marker-end="url(#arr)"/>
    <line x1="220" y1="371" x2="220" y2="383" marker-end="url(#arr)"/>
    <line x1="220" y1="421" x2="220" y2="433" marker-end="url(#arr)"/>
    <line x1="220" y1="471" x2="220" y2="483" marker-end="url(#arr)"/>
    <line x1="220" y1="521" x2="220" y2="533" marker-end="url(#arr)"/>
    <line x1="220" y1="571" x2="220" y2="583" marker-end="url(#arr)"/>
  </g>
  <text x="86" y="651" class="t">9. Verify Deployment</text><text x="360" y="651" text-anchor="end" class="s">curl /health</text>
  <line x1="220" y1="621" x2="220" y2="628" class="ln" marker-end="url(#arr)"/>

  <!-- Nexus -->
  <rect x="470" y="380" width="320" height="170" rx="10" class="key"/>
  <text x="630" y="406" text-anchor="middle" class="tb">Sonatype Nexus Repository</text>
  <text x="630" y="424" text-anchor="middle" class="s">Docker container, localhost:8081</text>
  <text x="490" y="452" class="s">raw (hosted) repo: devops-artifacts</text>
  <text x="490" y="472" class="s" font-family="monospace">nexus-artifact-demo/</text>
  <text x="505" y="490" class="s" font-family="monospace">1.0.1/ 1.0.2/ ... 1.0.N/</text>
  <text x="520" y="508" class="s" font-family="monospace">nexus-artifact-demo-1.0.N.tgz</text>
  <text x="520" y="526" class="s" font-family="monospace">build-info.json</text>
  <text x="490" y="542" class="s">user: jenkins-ci (least privilege)</text>

  <path d="M370,450 C420,450 420,430 468,430" class="lnO" marker-end="url(#arrO)"/>
  <text x="392" y="426" class="lbl">upload v1.0.N</text>
  <path d="M468,520 C420,520 420,503 372,503" class="lnO" marker-end="url(#arrO)"/>
  <text x="388" y="492" class="lbl">download + verify</text>

  <!-- Docker -->
  <rect x="470" y="575" width="320" height="130" rx="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="486" y="596" class="tb">Docker Desktop</text>
  <rect x="490" y="606" width="280" height="36" rx="6" class="box"/>
  <text x="630" y="629" text-anchor="middle" class="t">image nexus-artifact-demo:1.0.N</text>
  <rect x="490" y="656" width="280" height="36" rx="6" class="box"/>
  <text x="630" y="679" text-anchor="middle" class="t">container nexus-artifact-demo-app</text>
  <line x1="630" y1="642" x2="630" y2="654" class="ln" marker-end="url(#arr)"/>
  <line x1="370" y1="553" x2="488" y2="620" class="ln" marker-end="url(#arr)"/>
  <line x1="370" y1="603" x2="488" y2="672" class="ln" marker-end="url(#arr)"/>

  <!-- Running app -->
  <rect x="470" y="725" width="320" height="52" rx="8" class="box" stroke="#16a34a"/>
  <text x="630" y="747" text-anchor="middle" class="tb">Running application</text>
  <text x="630" y="766" text-anchor="middle" class="s">http://localhost:3000  ( /, /health, /api/info )</text>
  <line x1="630" y1="692" x2="630" y2="723" class="ln" marker-end="url(#arr)"/>
  <path d="M220,662 L220,751 L468,751" class="ln" marker-end="url(#arr)" stroke-dasharray="4 3"/>
  <text x="228" y="742" class="s">health check</text>
</svg>
